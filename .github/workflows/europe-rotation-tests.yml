name: Europe rotation tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest -v test_europe_rotation test_europe_history
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build SmallCityMastodonBot.csproj --configuration Release
      - run: dotnet run --project SmallCityMastodonBot.csproj --configuration Release --no-build --no-launch-profile -- /europetest
