name: Europe rotation tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-europe.txt
      - run: python3 -m unittest -v test_europe_rotation test_europe_history test_europe_daily test_europe_map
