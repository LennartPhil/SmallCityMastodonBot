name: Europe dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build SmallCityMastodonBot.csproj --configuration Release
      - name: Check Europe selection and safeguards
        run: dotnet run --project SmallCityMastodonBot.csproj --configuration Release --no-build --no-launch-profile -- /europetest

      - name: Generate a post without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          EUROPE_STATE_BRANCH: ${{ github.ref_name }}
          OVERPASS_PRIMARY_URL: ${{ secrets.OVERPASS_PRIMARY_URL }}
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project SmallCityMastodonBot.csproj --configuration Release --no-build --no-launch-profile -- /europe 2>&1 | tee europe-dry-run.log

          if ! grep -Fq "Preview only: no publication or history update." europe-dry-run.log; then
            echo "::error::The bot did not finish generating a test post."
            exit 1
          fi

      - name: Save log and generated map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: europe-dry-run
          path: |
            europe-dry-run.log
            europe-preview.png
            europe-post.txt
          retention-days: 7