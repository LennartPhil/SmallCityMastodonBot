name: Collect Europe towns

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: europe-town-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore completed country queries
        uses: actions/cache/restore@v4
        with:
          path: towns-cache
          key: europe-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            europe-collection-v1-
      - name: Collect population-qualified towns
        env:
          OVERPASS_PRIMARY_URL: ${{ secrets.OVERPASS_PRIMARY_URL }}
        run: |
          test -n "$OVERPASS_PRIMARY_URL" || { echo "::error::Set OVERPASS_PRIMARY_URL first"; exit 1; }
          python3 generate_europe_towns.py --countries all --output collection/townsList_Europe_candidates.json
      - name: Save progress even if a later country failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: towns-cache
          key: europe-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save dataset and collection progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: europe-population-collection
          path: |
            collection/
            towns-cache/
          retention-days: 30
          if-no-files-found: warn
